name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build

  # Deploying from here rather than from Cloudflare's own Git integration,
  # because the Pages project was created as Direct Upload and Cloudflare
  # refuses to convert one:
  #
  #   PATCH /accounts/{id}/pages/projects/vectormojo
  #   8000069 "You cannot update the `source` object in a Direct Uploads project."
  #
  # The only way to get the native integration is to delete and recreate the
  # project, which would drop its deployment history and risk losing the
  # `vectormojo.pages.dev` subdomain in the gap. Not worth it to save a command.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # `secrets` is not available in a job-level `if`, so the gate is a step.
      # Without it every push to main would fail red until the token exists,
      # which just trains everyone to ignore a red CI.
      - id: guard
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set, skipping deploy. See OWNER_ACTIONS.md."
            exit 0
          fi
          # Present is not the same as working. A token that is set and
          # REJECTED is a deploy that used to run and silently stopped, and
          # skipping it quietly means the green tick says "shipped" while the
          # live site sits behind the commit. That is exactly how the sibling
          # repo went unnoticed until 2026-08-17. Never-set stays a notice;
          # rejected is red.
          status=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify)
          if [ "$status" != "200" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::error::CLOUDFLARE_API_TOKEN is rejected by Cloudflare (HTTP $status). Pages was NOT deployed and the live site is now behind this commit. Rotate the token."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - if: steps.guard.outputs.ready == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - if: steps.guard.outputs.ready == 'true'
        run: bun install --frozen-lockfile
      - if: steps.guard.outputs.ready == 'true'
        run: bun run build

      - if: steps.guard.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=vectormojo --branch=main
