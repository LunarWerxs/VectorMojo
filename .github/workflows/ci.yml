name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build

  # Deploying from here rather than from Cloudflare's own Git integration,
  # because the Pages project was created as Direct Upload and Cloudflare
  # refuses to convert one:
  #
  #   PATCH /accounts/{id}/pages/projects/vectormojo
  #   8000069 "You cannot update the `source` object in a Direct Uploads project."
  #
  # The only way to get the native integration is to delete and recreate the
  # project, which would drop its deployment history and risk losing the
  # `vectormojo.pages.dev` subdomain in the gap. Not worth it to save a command.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # `secrets` is not available in a job-level `if`, so the gate is a step.
      # Without it every push to main would fail red until the token exists,
      # which just trains everyone to ignore a red CI.
      - id: guard
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            # A ::warning, not a ::notice, and it says the consequence out loud.
            # A notice is easy to miss in a green run, and this job has been
            # skipping the deploy and reporting success since the secrets were
            # never added, so every push to main since then has looked shipped
            # and shipped nothing. A green that means "deployed nothing" is the
            # one failure mode worse than a red.
            echo "::warning::NOT DEPLOYED. CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set, so this push did NOT reach vectormojo.lunarwerx.com. The site is still serving the previous deployment. See OWNER_ACTIONS.md."
            {
              echo "### ⚠️ Deploy skipped, site NOT updated"
              echo ""
              echo "\`CLOUDFLARE_API_TOKEN\` / \`CLOUDFLARE_ACCOUNT_ID\` are not set on this repository."
              echo "The build passed, but nothing was published, so vectormojo.lunarwerx.com still serves the previous deployment."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # No /user/tokens/verify precheck here either - see the sibling repo:
          # that endpoint 401s valid non-classic credentials, so gating on it
          # blocks working deploys. wrangler-action reports the real failure.
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - if: steps.guard.outputs.ready == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - if: steps.guard.outputs.ready == 'true'
        run: bun install --frozen-lockfile
      - if: steps.guard.outputs.ready == 'true'
        run: bun run build

      - if: steps.guard.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=vectormojo --branch=main
