      <header>
        <h1>VectorMojo</h1>
        <p>Design files to vectors, in your browser. No upload, no server.</p>
        <nav aria-label="Primary">
          <a href="#what-it-does">What it does</a> ·
          <a href="#comparison">How it compares</a> ·
          <a href="#faq">FAQ</a> ·
          <a href="https://github.com/LunarWerxs/vectormojo">Source on GitHub</a>
        </nav>
      </header>
      <main>
        <section id="what-it-does">
          <h2>What VectorMojo does</h2>
          <p>
            VectorMojo turns awkward design files &mdash; PSD, PSB, PDF, Illustrator AI, EPS, SVG,
            PNG, and JPEG &mdash; into clean vector graphics, entirely inside your browser. There is
            no upload step and no server that holds on to the original file; file reading, parsing,
            tracing, rendering, and export all happen in the current browser tab with JavaScript and
            WebAssembly.
          </p>
          <p>
            It is built for anyone who needs the vector trapped inside a design file: pulling a logo
            out of a PSD, getting real SVG geometry out of a PDF someone sent years ago, or turning a
            PNG into an editable starting point.
          </p>
          <ul>
            <li>Rescues vector artwork from PSD/PSB, PDF, modern Illustrator (.ai), and EPS files</li>
            <li>Opens, sanitizes, normalizes, rounds, prettifies, or minifies SVG files you already have</li>
            <li>Traces PNG and JPEG bitmaps into approximate SVG paths when tracing is the only option</li>
            <li>Exports SVG, transparent or white-background PNG at exact pixel dimensions, or PDF, or copies the SVG straight into a project</li>
            <li>Handles multi-page PDFs, background choice, export precision, batch drops, masks, patterns, gradients, and transparent previews</li>
            <li>The first 10 conversions work as a guest; a free Connections account unlocks unlimited conversions</li>
          </ul>
          <p>
            8 input formats in, 4 export options out, built on 11 open-source and in-house
            components (Bun, Vue 3, Vite, Tailwind CSS 4, Connections, ag-psd, MuPDF.js,
            Ghostscript WASM, SVGO, ImageTracer.js, and jsPDF). Currently at version 0.1.0.
          </p>
        </section>
        <section id="comparison">
          <h2>How VectorMojo compares</h2>
          <p>
            People weighing VectorMojo up usually already have one of these open:
          </p>
          <ul>
            <li>
              <strong>Adobe Illustrator</strong> &mdash; the professional desktop standard, with
              deep PSD/PDF/EPS support and its own Image Trace tool. It's paid, subscription-based,
              and installs locally rather than running in a browser tab.
            </li>
            <li>
              <strong>Online PSD/AI/EPS-to-SVG converters</strong> (the CloudConvert/Convertio
              style of tool) &mdash; convenient and require no install, but work by uploading your
              file to a server for processing.
            </li>
            <li>
              <strong>Inkscape</strong> &mdash; free and open source, and includes bitmap tracing,
              but it's a desktop application, it doesn't open PSD, and its Illustrator support
              covers only .ai files saved with the PDF-compatible option, with some fidelity
              loss on gradient meshes and transparency.
            </li>
            <li>
              <strong>VectorMojo</strong> &mdash; runs the whole conversion, including bitmap
              tracing, inside the browser tab with WebAssembly. No install, no upload, and no
              account required for the first 10 conversions.
            </li>
          </ul>
        </section>
        <section id="faq">
          <h2>Frequently asked questions</h2>
          <h3>Is VectorMojo free?</h3>
          <p>
            Yes, completely. The first 10 conversions work as a guest, no account needed. After
            that, a free Connections account unlocks unlimited conversions; there's no paid
            tier, no subscription, and no credit card required. VectorMojo's own source is MIT
            licensed and open on GitHub.
          </p>
          <h3>Does VectorMojo work offline, or does it upload my file?</h3>
          <p>
            No file ever leaves your browser tab. VectorMojo has no backend: reading, parsing,
            tracing, rendering, and exporting all run locally in JavaScript and WebAssembly.
            Closing the tab closes the workbench. The only network call is a single anonymous
            visit ping that never includes your file, filename, or result.
          </p>
          <h3>What file formats does VectorMojo support?</h3>
          <p>
            VectorMojo opens PSD, PSB, PDF, modern PDF-compatible Illustrator (.ai) files,
            EPS/PostScript, and SVG, plus traces PNG and JPEG bitmaps. Older, non-PDF Illustrator
            files aren't supported. From any input, it exports SVG, transparent or
            white-background PNG at exact pixel dimensions, PDF, or clipboard-ready SVG markup.
          </p>
          <h3>How is VectorMojo different from Adobe Illustrator or online file converters?</h3>
          <p>
            Illustrator is paid desktop software with a subscription and an Image Trace tool.
            Most online PSD/AI/EPS-to-SVG converters upload your file to a server for processing.
            VectorMojo runs the whole conversion, including tracing, inside your browser tab with
            WebAssembly, with no install, no upload, and no account required for the first 10
            files.
          </p>
          <h3>Can VectorMojo turn a PNG or JPEG into a real editable vector?</h3>
          <p>
            It traces PNG and JPEG bitmaps into approximate SVG paths using a local color trace,
            run entirely in the browser. That result is explicitly an approximation rather than a
            faithful reconstruction, but it's often good enough for a draft, an icon, or a
            starting point to clean up by hand.
          </p>
          <h3>Do I need to create an account to use VectorMojo?</h3>
          <p>
            No. The first 10 conversions work as a guest with no sign-up at all. Creating a free
            Connections account only becomes necessary if you want unlimited conversions beyond
            that. VectorMojo never asks for payment details, and the sign-in session is the only
            thing that ever leaves your browser tab.
          </p>
          <h3>Is VectorMojo open source?</h3>
          <p>
            Yes. VectorMojo's own code is MIT licensed, version 0.1.0, and hosted openly at
            github.com/LunarWerxs/vectormojo. The browser bundle also includes two AGPL-licensed
            components, MuPDF.js and Ghostscript WASM, for PDF and EPS handling; their license
            texts and corresponding-source pointers ship with every public build.
          </p>
          <h3>Does VectorMojo work on Mac, Windows, or Linux?</h3>
          <p>
            VectorMojo runs entirely in the browser, so it works on any operating system with a
            modern browser that supports JavaScript and WebAssembly: Windows, macOS,
            Linux, and Chromebooks alike. There's nothing to install and nothing platform-specific;
            the same tab-based workbench runs everywhere.
          </p>
        </section>

#lwdc-badge.lwdc-light #lwdc-x{border-color:rgba(15,23,42,.15);background:#fff;color:#64748b}
#lwdc-badge.lwdc-light #lwdc-x:hover,#lwdc-badge.lwdc-light #lwdc-x:focus-visible{border-color:rgba(15,23,42,.3);color:#0f172a}
</style>
<script>
(function () {
  var KEY = 'lw:discord-badge-dismissed';
  var el = document.getElementById('lwdc-badge');
  if (!el) return;
  // Wrapped because Safari with storage blocked THROWS on access rather than
  // returning null, and a social badge must never be able to break a page.
  function got(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  if (got(KEY) === '1') return;

  /* Which skin. Measured, not configured: walk up from <body> to the first
     element with a real background and score its luminance. That covers a site
     that is always light, a site that is always dark, and a site that follows
     the OS, with no per-site list to keep in sync. Anything unreadable falls
     through to the dark skin, which is what most of these pages want. */
  function luminance() {
    var node = document.body;
    while (node) {
      var bg = getComputedStyle(node).backgroundColor;
      var m = /rgba?\(([\d.]+)[,\s]+([\d.]+)[,\s]+([\d.]+)(?:[,\s\/]+([\d.]+))?/.exec(bg || '');
      if (m && (m[4] === undefined || parseFloat(m[4]) > 0.1)) {
        return (0.2126 * +m[1] + 0.7152 * +m[2] + 0.0722 * +m[3]) / 255;
      }
      node = node.parentElement;
    }
    return 0;
  }
  function skin() { try { if (luminance() > 0.55) el.classList.add('lwdc-light'); } catch (e) {} }

  setTimeout(function () {
    skin();
    el.hidden = false;
    // Next frame, so the transition has a start state to move from.
    requestAnimationFrame(function () { el.classList.add('lwdc-in'); });
  }, 1400);

  // Re-measure if the page's own theme flips underneath us.
  if (window.matchMedia) {
    try {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
        el.classList.remove('lwdc-light'); skin();
      });
    } catch (e) { /* older Safari lacks addEventListener here; the initial skin stands */ }
  }

  document.getElementById('lwdc-x').addEventListener('click', function () {
    el.classList.remove('lwdc-in');
    setTimeout(function () { el.hidden = true; }, 280);
    try { localStorage.setItem(KEY, '1'); } catch (e) { /* blocked; gone for this page anyway */ }
  });
})();
</script>
<!-- /LunarWerx Discord badge -->
</body>
</html>
