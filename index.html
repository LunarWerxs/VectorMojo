    <noscript>
      <h1>VectorMojo</h1>
      <p>
        VectorMojo turns awkward design files &mdash; PSD, PSB, PDF, Illustrator AI, EPS, SVG,
        PNG, and JPEG &mdash; into clean vector graphics, entirely inside your browser. There is
        no upload step and no server that holds on to the original file; file reading, parsing,
        tracing, rendering, and export all happen in the current browser tab with JavaScript and
        WebAssembly.
      </p>
      <p>
        It is built for anyone who needs the vector trapped inside a design file: pulling a logo
        out of a PSD, getting real SVG geometry out of a PDF someone sent years ago, or turning a
        PNG into an editable starting point.
      </p>
      <ul>
        <li>Rescues vector artwork from PSD/PSB, PDF, modern Illustrator (.ai), and EPS files</li>
        <li>Opens, sanitizes, normalizes, rounds, prettifies, or minifies SVG files you already have</li>
        <li>Traces PNG and JPEG bitmaps into approximate SVG paths when tracing is the only option</li>
        <li>Exports SVG, transparent or white-background PNG at exact pixel dimensions, or PDF, or copies the SVG straight into a project</li>
        <li>Handles multi-page PDFs, background choice, export precision, batch drops, masks, patterns, gradients, and transparent previews</li>
        <li>The first 10 conversions work as a guest; a free Connections account unlocks unlimited conversions</li>
      </ul>
